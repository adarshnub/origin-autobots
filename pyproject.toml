[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "autobots-origin-api"
version = "0.1.0"
description = "Autobots by Origin Studios API and local orchestration primitives"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.13.3",
  "PyJWT[crypto]==2.10.1",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.3.4"]
gcp = ["google-genai==2.25.0"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "apps/website/tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["services", "services.*", "packages", "packages.*"]
